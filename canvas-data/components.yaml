components:
  - name: Diary interface
    purpose: Audio upload, recording, typed diary, date browsing, viewing, and keyword search
    current_direction: Web interface first

  - name: Conversation interface
    purpose: AI-led voice conversation with relevant follow-up questions
    current_direction: Streaming is strongly considered but the first transport is undecided

  - name: Backend service
    notebook_direction: Java
    purpose: Diary workflows, processing coordination, search, accounts, and storage

  - name: External audio AI
    current_direction: Google or another free API when suitable
    purpose: Transcription, translation, and uncertainty output

  - name: Local AI model
    stage: future
    purpose: Replace or reduce dependence on external processing

  - name: Relational source of truth
    notebook_direction: PostgreSQL
    purpose: Users, sessions, diary items, text outputs, dates, confidence, and soft deletion

  - name: Audio storage
    choice: not_selected
    purpose: Retain original audio

  - name: Vector search
    stage: later
    purpose: Semantic diary retrieval

  - name: Knowledge graph
    stage: later
    purpose: Connected memories, people, events, habits, and goals

  - name: Hosting environment
    preferred: friend's home system if practical
    fallback: cloud
