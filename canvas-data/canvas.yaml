project:
  name: AHAM
  development_model: phased and incremental

phases:
  phase_1:
    version: 1
    name: ADI
    expanded_name: Audio Diary Initiative
    scope: diary product and application foundation
    includes:
      - diary CRUD foundation
      - audio upload or recording
      - typed diary
      - original transcript
      - English translation
      - original audio retention
      - date browsing
      - keyword search
      - users and profiles
      - email OTP registration
      - username or email login
      - sessions
      - soft deletion
      - database design
      - API contracts
    unresolved:
      - exact update or editing boundary
      - audio upload versus streaming priority
      - processing mode
      - date model
      - user field requirements
      - purge lifecycle

  phase_2:
    name: Second Brain
    starts_after: ADI foundation is complete
    includes:
      - semantic or vector search
      - knowledge graph
      - connected memories
      - entities and relationships
      - personal patterns
      - dashboards
      - proactive insights

boundary:
  - Phase 1 may preserve stable IDs for future references.
  - Phase 1 does not implement Phase 2 behavior.
  - Unclear decisions are not silently completed.
