database_canvas:
  source_of_truth:
    direction: PostgreSQL

  user:
    confirmed:
      email_required: true
      registration_verification: email OTP
      login_identifiers:
        - username
        - email
      login_secret: password
    fields_seen:
      - user_id_or_id
      - username
      - email
      - password
      - first_name
      - last_name
      - age_or_date_of_birth
      - phone_number
      - nickname
      - profile_summary
    unresolved:
      - required versus optional fields
      - id versus user_id
      - username rules

  diary_item:
    user_facing_name: not_final
    working_internal_name: diary_entry
    confirmed_behavior:
      - audio or typed input
      - backdated entry allowed
      - may cover multiple days
      - original audio retained
      - original transcript stored
      - English translation stored
      - keyword searchable
      - editing disabled initially
      - soft deletion
    possible_fields:
      - entry_id
      - user_id
      - input_kind
      - created_at
      - diary_date
      - covered_date_range_or_dates
      - audio_reference
      - deleted_at
    unresolved:
      - final resource and table name
      - exact multi-day representation
      - UTC and timezone field strategy

  text_outputs:
    version_1:
      - original transcript
      - English translation
    uncertainty:
      - transcription confidence
    unresolved:
      - canonical text record shape
      - segment or word confidence
      - English duplication across storage layers

  audio_record:
    retained: true
    unresolved:
      - metadata fields
      - filesystem versus object storage
      - maximum duration and size

  sessions:
    fields_seen:
      - session_id
      - user_id
      - refresh_token_hash
      - expires_at
      - device
      - ip_address

  later_layers:
    - vector search
    - knowledge graph
    - attachments

  not_defined:
    - final table names
    - data types
    - constraints
    - indexes
    - retention period
    - permanent purge behavior
